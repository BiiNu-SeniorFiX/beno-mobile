<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<title>BeNo Mobile</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f10;--card:#1a1a1c;--ink:#f2f2f2;--mut:#9a9aa1;--line:#2c2c30;--pri:#d8342a;
--c0:#7a8a96;--c1:#d99a1c;--c2:#e8672a;--c3:#3b7bf0;--c4:#22a35a;--c5:#8b98a3;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'IBM Plex Sans Thai',system-ui,'Noto Sans Thai',Tahoma,sans-serif}
main{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 150px}
header,.brand{display:flex;align-items:center;gap:12px}
header{justify-content:space-between}
h1{font-size:20px;font-weight:600;margin:0;line-height:1.2}
small,.r4,.r3{color:var(--mut);font-size:14px}
.lg{background:#fff;border-radius:10px;padding:4px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px}
:focus-visible{outline:2px solid #ff7a6e;outline-offset:2px}
.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));padding:12px 20px;z-index:5}
a{color:#ff7a6e}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 0;color:var(--mut)}
nav button.on{color:#fff;font-weight:600;box-shadow:inset 0 -3px 0 var(--pri)}
.sum{display:flex;gap:12px;margin:16px 0}
.sum div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sum span{color:var(--mut);font-size:13px}
.sum b{display:block;font-size:18px;font-weight:600}
#q{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{white-space:nowrap;font-size:14px;padding:6px 12px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--s);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.pill{font-size:13px;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--s) 25%,transparent);white-space:nowrap}
.r1,.r3{display:flex;justify-content:space-between;gap:8px;align-items:center}
.r2{font-weight:500}
.nx{margin-top:8px;font-size:14px;border-color:var(--s)}
.empty{color:var(--mut);text-align:center;padding:32px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px;font-size:20px}
.sheet h3{margin:20px 0 8px;font-size:16px}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:10px}
label input,label select,label textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc{grid-template-columns:1fr 2fr}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;z-index:30;font-size:14px}
</style>
</head>
<body>
<main>
<header><div class="brand"><img class="lg" data-img="ic" alt="BeNo Mobile" width="44" height="44"><div><h1>BeNo Mobile</h1><small id="sync"></small></div></div><button onclick="$('#ab').hidden=false">ข้อมูลร้าน</button></header>
<div class="sum"><div><span>รายได้เดือนนี้ (งานซ่อม+ขาย)</span><i id="inc"></i></div><div><span>ค้างรับเงิน</span><i id="due"></i></div></div>

<section id="v-jobs">
<input id="q" type="search" placeholder="ค้นหาชื่อ เบอร์โทร รุ่น หรือเลขงาน" oninput="qs=this.value.trim().toLowerCase();render()">
<div class="chips" id="chips"></div>
<div id="list"></div>
</section>

<section id="v-sales" hidden>
<label>สินค้า / บริการ<select id="si" onchange="const i=D.Stock.find(x=>x.id==this.value);if(i)$('#sp').value=i.price"></select></label>
<div class="two"><label>จำนวน<input id="sq" type="number" min="1" value="1" inputmode="numeric"></label><label>ราคาต่อหน่วย<input id="sp" type="number" min="0" inputmode="numeric"></label></div>
<div class="two cc"><label>รหัสประเทศ<select id="sc"><option value="856">+856 ลาว</option><option value="66">+66 ไทย</option></select></label><label>เบอร์ WhatsApp ลูกค้า (ถ้ามี)<input id="sph" inputmode="tel"></label></div>
<div class="acts"><button class="pri" onclick="sell(0)">บันทึกขาย</button><button onclick="sell(1)">บันทึก + ส่งใบเสร็จ WhatsApp</button></div>
<h3>รายการขายล่าสุด</h3>
<div id="sl"></div>
</section>

<section id="v-stock" hidden><div class="chips" id="kchips"></div><div id="stl"></div></section>
</main>

<button id="fab" class="pri fab" onclick="view=='jobs'?edit(null):editI(null)"></button>
<nav><button data-v="jobs" onclick="go('jobs')">งานซ่อม</button><button data-v="sales" onclick="go('sales')">ขาย</button><button data-v="stock" onclick="go('stock')">สต็อก</button></nav>
<div id="toast" hidden></div>

<div id="ov" class="ov" hidden onclick="if(event.target==this)closeS()">
<form id="fm" class="sheet" onsubmit="return false">
<h2 id="ft"></h2><small id="tm"></small>
<label>ชื่อลูกค้า<input name="name" required></label>
<div class="two cc"><label>รหัสประเทศ<select name="cc" onchange="this.form.elements.lang.value=this.value=='856'?'lo':'th'"><option value="856">+856 ลาว</option><option value="66">+66 ไทย</option></select></label><label>เบอร์โทร / WhatsApp<input name="phone" inputmode="tel"></label></div>
<label>ภาษาข้อความ WhatsApp<select name="lang"><option value="th">ไทย</option><option value="lo">ລາວ</option></select></label>
<label>รุ่นเครื่อง<input name="model" required></label>
<label>IMEI / Serial<input name="imei"></label>
<label>อาการเสีย<textarea name="problem" rows="2" required></textarea></label>
<label>ช่างผู้ซ่อม<input name="tech"></label>
<div class="two"><label>อะไหล่ที่ใช้<select name="part"></select></label><label>จำนวนที่ใช้<input name="pq" type="number" min="1" value="1" inputmode="numeric"></label></div>
<label>สกุลเงิน<select name="cur"><option value="LAK">LAK ₭ กีบ</option><option value="THB">THB ฿ บาท</option></select></label>
<div class="two"><label>ค่าซ่อม<input name="price" type="number" min="0" inputmode="numeric"></label><label>มัดจำ<input name="dep" type="number" min="0" inputmode="numeric"></label></div>
<label>สถานะ<select name="st" id="stsel"></select></label>
<div class="acts"><button type="button" class="pri" onclick="sv()">บันทึก</button><button type="button" onclick="closeS()">ปิด</button></div>
<div id="ex"><h3>ส่งทาง WhatsApp</h3><div class="acts"><button type="button" onclick="wa('slip')">ใบรับเครื่อง</button><button type="button" onclick="wa('stat')">แจ้งสถานะ</button><button type="button" onclick="wa('rc')">ใบเสร็จ</button></div><div class="acts"><button type="button" id="dl" onclick="del()">ลบงาน</button></div></div>
</form>
</div>

<div id="io" class="ov" hidden onclick="if(event.target==this)this.hidden=true">
<form id="fi" class="sheet" onsubmit="return false">
<h2>สินค้า / อะไหล่</h2>
<label>ชื่อ<input name="name" required></label>
<label>ประเภท (พิมพ์ชื่อใหม่เพื่อเพิ่มประเภทได้)<input name="kind" list="kl" required></label><datalist id="kl"></datalist>
<label style="display:flex;gap:8px;align-items:center"><input name="svc" type="checkbox" value="1" style="width:auto;margin:0;padding:0">ไม่นับสต็อก (บริการ เช่น ติดฟิล์ม)</label>
<div class="two"><label>จำนวนในสต็อก<input name="qty" type="number" min="0" inputmode="numeric"></label><label>สกุลเงิน<select name="cur"><option value="LAK">LAK ₭</option><option value="THB">THB ฿</option></select></label></div>
<div class="two"><label>ราคาทุน<input name="cost" type="number" min="0" inputmode="numeric"></label><label>ราคาขาย<input name="price" type="number" min="0" inputmode="numeric"></label></div>
<div class="acts"><button type="button" class="pri" onclick="svI()">บันทึก</button><button type="button" onclick="$('#io').hidden=true">ปิด</button><button type="button" id="di" onclick="delI()">ลบสินค้า</button></div>
</form>
</div>

<div id="ab" class="ov" hidden onclick="if(event.target==this)this.hidden=true"><div class="sheet">
<img class="lg" data-img="lg" alt="BeNo Mobile" width="150">
<h2>BeNo Mobile</h2>
<p id="info" class="r4"></p>
<h3>เชื่อมต่อ Google Sheet</h3>
<label>Web app URL<input id="cu" placeholder="https://script.google.com/macros/s/.../exec"></label>
<label>รหัสลับ (KEY)<input id="ck" type="password"></label>
<div class="acts"><button class="pri" onclick="saveCfg()">บันทึกและซิงค์</button><button onclick="$('#ab').hidden=true">ปิด</button></div>
</div></div>

<script>
const APP={name:'BeNo Mobile',dev:'BENO',ver:'9.2.0',tel:'02057805851',mail:'noyahoo4@gmail.com',fb:'BeNo'};
const CUR={LAK:'₭',THB:'฿'};
const KD={part:'อะไหล่',acc:'อุปกรณ์',svc:'บริการ'};
const L={

lo:{rc:'ໃບເສັດຮັບເງິນ',slip:'ໃບຮັບເຄື່ອງ',no:'ເລກທີ',dt:'ວັນທີ',cu:'ລູກຄ້າ',dv:'ເຄື່ອງ',pb:'ອາການ',fee:'ຄ່າສ້ອມ',paid:'ຈ່າຍແລ້ວ',bal:'ຍັງເຫຼືອ',full:'ຈ່າຍຄົບແລ້ວ',ct:'ຕິດຕໍ່',ml:'ອີເມວ',ty:'ຂອບໃຈທີ່ໃຊ້ບໍລິການ',hi:'ສະບາຍດີ',stt:'ສະຖານະ',it:'ລາຍການ',qt:'ຈຳນວນ',tot:'ລວມ',est:'ຄ່າສ້ອມໂດຍປະມານ',dep:'ມັດຈຳ',st:['ຮັບເຄື່ອງ','ກວດເຊັກ','ລໍຖ້າອາໄຫຼ່','ກຳລັງສ້ອມ','ສ້ອມແລ້ວ','ສົ່ງມອບແລ້ວ']}};
const ST=L.th.st;
const D={Jobs:[],Stock:[],Sales:[]};
let flt=-1,qs='',kf='',cur=null,curI=null,view='jobs',cfg={url:'',key:''};
const $=s=>document.querySelector(s);
const cu=c=>c=='THB'?'THB':'LAK';
const fmt=(n,c)=>CUR[c]+(+n||0).toLocaleString('en-US');
const num=(n,c)=>(+n||0).toLocaleString('en-US')+' '+c;
const ts=t=>new Date(t||Date.now()).toLocaleString('sv-SE');
const dtm=t=>t?new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}):'';
const dd=()=>dtm(Date.now());
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sync=t=>$('#sync').textContent=t;
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,2500)}
const mo=t=>{const d=new Date(t),n=new Date();return d.getMonth()==n.getMonth()&&d.getFullYear()==n.getFullYear()};
const nid=(a,p)=>p+String(Math.max(0,...a.map(x=>parseInt(String(x.id).slice(2))||0))+1).padStart(4,'0');
const N={
 Jobs:j=>({...j,phone:String(j.phone||''),cc:String(j.cc||'856'),price:+j.price||0,dep:+j.dep||0,st:+j.st||0,t:+j.t||0,dt:+j.dt||0,cur:cu(j.cur),part:String(j.part||''),pq:+j.pq||0,pd:+j.pd||0}),
 Stock:i=>({...i,qty:+i.qty||0,cost:+i.cost||0,price:+i.price||0,cur:cu(i.cur),svc:i.svc===undefined||i.svc===''?(i.svc?1:0):(+i.svc?1:0),kind:KD[i.kind]||i.kind||'อะไหล่'}),
 Sales:s=>({...s,qty:+s.qty||0,price:+s.price||0,t:+s.t||0,cur:cu(s.cur)})};
function load(){
 try{const d=JSON.parse(localStorage.getItem('rj')||'null');if(d)for(const n in D)D[n]=(d[n]||d[n.toLowerCase()]||[]).map(N[n])}catch(e){}
 try{cfg=JSON.parse(localStorage.getItem('rc')||'null')||cfg}catch(e){}
}
const save=()=>{try{localStorage.setItem('rj',JSON.stringify(D))}catch(e){}};
async function api(tab,b){
 const r=b?await fetch(cfg.url,{method:'POST',body:JSON.stringify({...b,tab,key:cfg.key})}):await fetch(cfg.url+'?key='+encodeURIComponent(cfg.key)+'&tab='+tab);
 const d=await r.json();if(!d.ok)throw 0;return d;
}
async function pull(){
 if(!cfg.url)return sync('ยังไม่ได้เชื่อมต่อ Google Sheet');
 sync('กำลังซิงค์…');
 try{
  for(const n in D){
   const d=await api(n);
   if(!d.rows.length&&D[n].length)for(const r of D[n])await api(n,{op:'put',row:r});
   else D[n]=d.rows.map(N[n]);
  }
  save();render();sync('เชื่อมต่อ Google Sheet แล้ว');
 }catch(e){sync('ซิงค์ไม่สำเร็จ ใช้ข้อมูลในเครื่อง')}
}
function push(n,b){if(cfg.url)api(n,b).then(()=>sync('บันทึกลง Google Sheet แล้ว'),()=>sync('บันทึกลงชีตไม่สำเร็จ'))}
const lg=(act,ref,detail)=>push('Log',{op:'put',row:{id:'L'+Date.now()+Math.floor(Math.random()*1000),at:ts(),act,ref,detail}});
function saveCfg(){
 cfg={url:$('#cu').value.trim(),key:$('#ck').value.trim()};
 try{localStorage.setItem('rc',JSON.stringify(cfg))}catch(e){}
 $('#ab').hidden=true;pull();
}
function go(v){view=v;render()}
function render(){
 for(const v of['jobs','sales','stock'])$('#v-'+v).hidden=v!=view;
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==view));
 const fb=$('#fab');fb.hidden=view=='sales';fb.textContent=view=='jobs'?'+ รับงานใหม่':'+ เพิ่มสินค้า';
 const by=(a,b)=>Object.keys(CUR).map(c=>`<b>${fmt(D.Jobs.filter(j=>j.cur==c).reduce((x,j)=>x+a(j),0)+D.Sales.filter(s=>s.cur==c).reduce((x,s)=>x+b(s),0),c)}</b>`).join('');
 $('#inc').innerHTML=by(j=>j.st==5&&mo(j.dt)?j.price:0,s=>mo(s.t)?s.price*s.qty:0);
 $('#due').innerHTML=by(j=>j.st<5?Math.max(0,j.price-j.dep):0,()=>0);
 if(view=='jobs')rJobs();else if(view=='sales')rSales();else rStock();
}
function rJobs(){
 $('#chips').innerHTML=['ทั้งหมด',...ST].map((s,i)=>{const k=i-1,n=k<0?D.Jobs.length:D.Jobs.filter(j=>j.st==k).length;
  return `<button class="chip${flt==k?' on':''}" onclick="flt=${k};render()">${s} ${n}</button>`}).join('');
 const L2=D.Jobs.filter(j=>(flt<0||j.st==flt)&&(!qs||[j.id,j.name,j.phone,j.model].join(' ').toLowerCase().includes(qs)))
  .sort((a,b)=>(a.st==5)-(b.st==5)||b.t-a.t);
 $('#list').innerHTML=L2.length?L2.map(j=>`<article class="card" style="--s:var(--c${j.st})" onclick="edit('${j.id}')">
<div class="r1"><b>${esc(j.model)}</b><span class="pill">${ST[j.st]}</span></div>
<div class="r2">${esc(j.name)}</div><div class="r4">${esc(j.problem)}</div><div class="r4">รับ ${dtm(j.t)}${j.st==5&&j.dt?' ส่งมอบ '+dtm(j.dt):''}</div>
<div class="r3"><span>${j.id}</span><span>${fmt(j.price,j.cur)}${j.st<5&&j.price>j.dep?' ค้าง '+fmt(j.price-j.dep,j.cur):''}</span></div>
${j.st<5?`<button class="nx" onclick="event.stopPropagation();adv('${j.id}')">ขยับเป็น ${ST[j.st+1]}</button>`:''}</article>`).join('')
  :'<p class="empty">ยังไม่มีงานในหมวดนี้ กด “รับงานใหม่” เพื่อเริ่มต้น</p>';
}
function rSales(){
 const sel=$('#si'),v=sel.value;
 sel.innerHTML='<option value="">เลือกสินค้า</option>'+D.Stock.map(i=>`<option value="${i.id}">${esc(i.name)}${i.svc?'':' (เหลือ '+i.qty+')'}</option>`).join('');
 sel.value=v;
 $('#sl').innerHTML=D.Sales.slice().sort((a,b)=>b.t-a.t).slice(0,30).map(s=>`<div class="card" style="--s:var(--c4)"><div class="r1"><b>${esc(s.name)} ×${s.qty}</b><span>${fmt(s.price*s.qty,s.cur)}</span></div><div class="r3"><span>${s.id} ${dtm(s.t)}</span><button class="nx" onclick="undo('${s.id}')">ยกเลิก</button></div></div>`).join('')||'<p class="empty">ยังไม่มีรายการขาย</p>';
}
function rStock(){
 const ks=[...new Set(D.Stock.map(i=>i.kind))];
 $('#kchips').innerHTML=['',...ks].map(k=>`<button class="chip${kf==k?' on':''}" data-k="${esc(k)}" onclick="kf=this.dataset.k;render()">${k?esc(k):'ทั้งหมด'}</button>`).join('');
 $('#stl').innerHTML=D.Stock.filter(i=>!kf||i.kind==kf).map(i=>`<article class="card" style="--s:var(--c${i.svc?5:i.qty<=2?2:4})" onclick="editI('${i.id}')"><div class="r1"><b>${esc(i.name)}</b><span class="pill">${esc(i.kind)}</span></div><div class="r3"><span>${i.svc?'ไม่นับสต็อก':'คงเหลือ '+i.qty}</span><span>${fmt(i.price,i.cur)}</span></div>${i.svc?'':`<div class="acts"><button class="nx" onclick="event.stopPropagation();adj('${i.id}',-1)">−1</button><button class="nx" onclick="event.stopPropagation();adj('${i.id}',1)">+1</button></div>`}</article>`).join('')||'<p class="empty">ยังไม่มีสินค้า กด “เพิ่มสินค้า” เพื่อเริ่มต้น</p>';
}
function adv(id){const j=D.Jobs.find(x=>x.id==id),o=j.st;j.st++;if(j.st==5){j.dt=Date.now();j.dat=ts();j.dep=j.price}j.uat=ts();save();render();push('Jobs',{op:'put',row:j});lg('เปลี่ยนสถานะ',id,ST[o]+' → '+ST[j.st]+(j.st==5?' (รับเงิน '+num(j.price,j.cur)+')':''))}
function edit(id){
 cur=id;const f=$('#fm'),j=D.Jobs.find(x=>x.id==id)||{name:'',cc:'856',phone:'',model:'',imei:'',problem:'',tech:'',cur:'LAK',price:'',dep:'',st:0,part:'',pq:1,pd:0};
 f.elements.part.innerHTML='<option value="">ไม่ใช้อะไหล่</option>'+D.Stock.filter(i=>!i.svc).map(i=>`<option value="${i.id}">${esc(i.name)} (เหลือ ${i.qty})</option>`).join('');
 for(const k of['name','cc','phone','model','imei','problem','tech','cur','price','dep','st','part','pq'])f.elements[k].value=j[k]||(k=='pq'?1:'');
 f.elements.part.disabled=f.elements.pq.disabled=!!j.pd;
 f.elements.lang.value=j.cc=='856'?'lo':'th';
 $('#ft').textContent=id?'งาน '+id:'รับงานใหม่';
 $('#tm').textContent=j.t?'รับงาน '+dtm(j.t)+(j.dt?'  ส่งมอบ '+dtm(j.dt):''):'';
 $('#ex').hidden=!id;$('#dl').textContent='ลบงาน';$('#ov').hidden=false;
}
function closeS(){$('#ov').hidden=true}
const fj=()=>{const d=Object.fromEntries(new FormData($('#fm')));d.price=+d.price||0;d.dep=+d.dep||0;d.st=+d.st;d.pq=+d.pq||0;d.id=cur;return d};
function sv(){
 const f=$('#fm');if(!f.reportValidity())return;
 const d=fj(),isNew=!cur,j=D.Jobs.find(x=>x.id==cur);
 const t=j?{...j,...d}:{...d,id:nid(D.Jobs,'R-'),t:Date.now(),pd:0,dt:0},o=j?j.st:0;
 if(d.st==5&&(!j||j.st!=5)){t.dt=Date.now();t.dat=ts()}
 if(t.part&&t.pq&&!t.pd){const it=D.Stock.find(x=>x.id==t.part);if(it){if(it.qty<t.pq)return toast('สต็อกอะไหล่ไม่พอ');it.qty-=t.pq;it.uat=ts();t.pd=1;push('Stock',{op:'put',row:it});lg('ใช้อะไหล่',t.id,it.name+' ×'+t.pq)}}
 t.cat=t.cat||ts(t.t);t.uat=ts();
 if(j)Object.assign(j,t);else D.Jobs.push(t);
 save();render();push('Jobs',{op:'put',row:t});
 lg(isNew?'รับงานใหม่':o!=t.st?'เปลี่ยนสถานะ':'แก้ไขงาน',t.id,isNew?t.model+' / '+t.name:o!=t.st?ST[o]+' → '+ST[t.st]:t.model);
 closeS();if(isNew)edit(t.id);
}
function del(){
 const b=$('#dl');
 if(b.textContent!='ลบงาน'){D.Jobs=D.Jobs.filter(x=>x.id!=cur);save();closeS();render();push('Jobs',{op:'del',id:cur});lg('ลบงาน',cur,'');return}
 b.textContent='แตะอีกครั้งเพื่อยืนยันการลบ';
}
const ft=t=>`\n\n${t.ct}: ${APP.tel}\n${t.ml}: ${APP.mail}\nFacebook: ${APP.fb}\n${t.ty}`;
function msg(k,j,l){
 const t=L[l],b=Math.max(0,j.price-j.dep);
 if(k=='stat')return `${t.hi} ${j.name}\n${t.dv}: ${j.model} (${j.id})\n${t.stt}: ${t.st[j.st]}`+(j.st<5&&b?`\n${t.bal}: ${num(b,j.cur)}`:'')+ft(t);
 const h=`${k=='rc'?'🧾 '+t.rc:'📱 '+t.slip} ${APP.name}\n${t.no}: ${j.id}\n${t.dt}: ${dd()}\n${t.cu}: ${j.name}\n${t.dv}: ${j.model}\n${t.pb}: ${j.problem}\n`;
 return h+(k=='rc'?`${t.fee}: ${num(j.price,j.cur)}\n${t.paid}: ${num(j.dep,j.cur)}\n${t.bal}: ${b?num(b,j.cur):t.full}`:`${t.est}: ${num(j.price,j.cur)}\n${t.dep}: ${num(j.dep,j.cur)}`)+ft(t);
}
const sm=(s,l)=>{const t=L[l];return `🧾 ${t.rc} ${APP.name}\n${t.no}: ${s.id}\n${t.dt}: ${dd()}\n${t.it}: ${s.name}\n${t.qt}: ${s.qty}\n${t.tot}: ${num(s.price*s.qty,s.cur)}`+ft(t)};
function sendWa(cc,ph,text){
 let p=String(ph||'').replace(/\D/g,'');
 if(!p)return toast('กรอกเบอร์โทรลูกค้าก่อน');
 if(!p.startsWith(cc))p=cc+p.replace(/^0+/,'');
 window.open('https://wa.me/'+p+'?text='+encodeURIComponent(text),'_blank');
}
const wa=k=>{const d=fj();sendWa(d.cc,d.phone,msg(k,d,d.lang))};
function sell(w){
 const it=D.Stock.find(x=>x.id==$('#si').value);if(!it)return toast('เลือกสินค้าก่อน');
 const q=+$('#sq').value||1;
 if(!it.svc){if(it.qty<q)return toast('สต็อกไม่พอ');it.qty-=q;it.uat=ts();push('Stock',{op:'put',row:it})}
 const s={id:nid(D.Sales,'P-'),t:Date.now(),at:ts(),item:it.id,name:it.name,qty:q,price:+$('#sp').value||0,cur:it.cur};
 D.Sales.push(s);save();push('Sales',{op:'put',row:s});lg('ขาย',s.id,s.name+' ×'+q+' = '+num(s.price*q,s.cur));
 if(w){const c=$('#sc').value;sendWa(c,$('#sph').value,sm(s,c=='856'?'lo':'th'))}
 render();toast('บันทึกขายแล้ว');
}
function undo(id){
 if(!confirm('ยกเลิกรายการขายนี้?'))return;
 const s=D.Sales.find(x=>x.id==id),it=D.Stock.find(x=>x.id==s.item);
 if(it&&!it.svc){it.qty+=s.qty;it.uat=ts();push('Stock',{op:'put',row:it})}
 D.Sales=D.Sales.filter(x=>x!=s);save();push('Sales',{op:'del',id});lg('ยกเลิกขาย',id,s.name+' ×'+s.qty);render();
}
function editI(id){
 curI=id;const f=$('#fi'),i=D.Stock.find(x=>x.id==id)||{name:'',kind:'อุปกรณ์',qty:'',cost:'',price:'',cur:'LAK',svc:0};
 for(const k of['name','kind','qty','cost','price','cur'])f.elements[k].value=i[k];
 f.elements.svc.checked=!!i.svc;
 $('#kl').innerHTML=[...new Set([...Object.values(KD),...D.Stock.map(x=>x.kind)])].map(k=>`<option value="${esc(k)}">`).join('');
 $('#di').hidden=!id;$('#di').textContent='ลบสินค้า';$('#io').hidden=false;
}
function svI(){
 const f=$('#fi');if(!f.reportValidity())return;
 const d=Object.fromEntries(new FormData(f));['qty','cost','price'].forEach(k=>d[k]=+d[k]||0);d.svc=d.svc?1:0;d.kind=d.kind.trim();if(d.svc)d.qty=0;d.uat=ts();
 let i=D.Stock.find(x=>x.id==curI);
 if(i)Object.assign(i,d);else{i={...d,id:nid(D.Stock,'S-')};D.Stock.push(i)}
 save();$('#io').hidden=true;render();push('Stock',{op:'put',row:i});lg(curI?'แก้ไขสินค้า':'เพิ่มสินค้า',i.id,i.name+' ('+i.kind+')');
}
function delI(){
 const b=$('#di');
 if(b.textContent!='ลบสินค้า'){D.Stock=D.Stock.filter(x=>x.id!=curI);save();$('#io').hidden=true;render();push('Stock',{op:'del',id:curI});lg('ลบสินค้า',curI,'');return}
 b.textContent='แตะอีกครั้งเพื่อยืนยันการลบ';
}
function adj(id,n){const i=D.Stock.find(x=>x.id==id);i.qty=Math.max(0,i.qty+n);i.uat=ts();save();render();push('Stock',{op:'put',row:i});lg('ปรับสต็อก',id,i.name+' '+(n>0?'+':'')+n+' เหลือ '+i.qty)}
document.querySelectorAll('[data-img]').forEach(e=>e.src=IMG[e.dataset.img]);
$('link[rel=icon]').href=IMG.ic;$('link[rel=apple-touch-icon]').href=IMG.ic;
$('#stsel').innerHTML=ST.map((s,i)=>`<option value="${i}">${s}</option>`).join('');
$('#info').innerHTML=`เวอร์ชัน ${APP.ver}<br>ผู้พัฒนา: ${APP.dev}<br>โทร: <a href="tel:${APP.tel}">${APP.tel}</a><br>อีเมล: <a href="mailto:${APP.mail}">${APP.mail}</a><br>Facebook: ${APP.fb}`;
load();$('#cu').value=cfg.url||'';$('#ck').value=cfg.key||'';render();pull();
</script>
</body>
</html>
